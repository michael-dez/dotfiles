# Hyprland keybinds converted from i3/config.
#
# i3 used $mod = Mod1 (Alt, either side). Here $mod is RIGHT ALT only.
#
# Hyprland modmasks cannot distinguish left from right, so bcpc.conf sets
# kb_options=lv3:ralt_switch, which xkb maps Right Alt to ISO_Level3_Shift =
# Mod5. Left Alt keeps working normally as ALT for application shortcuts.
# Cost: Right Alt no longer types AltGr third-level characters.
#
# Source this from hyprland.conf:
#     source = ~/.config/hypr/keybinds.conf
#
# Where a binding had no Wayland equivalent it is noted inline rather than
# silently dropped. See the NOT CONVERTED section at the bottom.

$mod = MOD5

# --- launch ---------------------------------------------------------------
bind = $mod, Return, exec, kitty                    # was xfce4-terminal
bind = $mod, d,      exec, noctalia msg panel-toggle launcher  # was rofi drun
bind = $mod, w,      exec, firefox
bind = $mod, n,      exec, thunar

# --- window management ----------------------------------------------------
bind = $mod, q, killactive,
bind = $mod, f, fullscreen, 0
bind = $mod SHIFT, space, togglefloating,
bind = $mod, space, cyclenext,                      # ~ focus mode_toggle

# i3 split h/v -> dwindle keeps one toggle for the next split direction
bind = $mod, minus, layoutmsg, preselect r          # was split h
bind = $mod, equal, layoutmsg, preselect d          # was split v
bind = $mod, e,     layoutmsg, togglesplit          # was layout toggle split

# i3 stacking/tabbed -> Hyprland groups are the nearest native equivalent
bind = $mod, s, togglegroup,                        # was layout stacking
bind = $mod, g, changegroupactive, f                # was layout tabbed

# --- focus ----------------------------------------------------------------
bind = $mod, h, movefocus, l
bind = $mod, j, movefocus, d
bind = $mod, k, movefocus, u
bind = $mod, l, movefocus, r
bind = $mod, Left,  movefocus, l
bind = $mod, Down,  movefocus, d
bind = $mod, Up,    movefocus, u
bind = $mod, Right, movefocus, r

# --- move -----------------------------------------------------------------
bind = $mod SHIFT, h, movewindow, l
bind = $mod SHIFT, j, movewindow, d
bind = $mod SHIFT, k, movewindow, u
bind = $mod SHIFT, l, movewindow, r
bind = $mod SHIFT, Left,  movewindow, l
bind = $mod SHIFT, Down,  movewindow, d
bind = $mod SHIFT, Up,    movewindow, u
bind = $mod SHIFT, Right, movewindow, r

# --- workspaces -----------------------------------------------------------
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# numpad, numlock OFF (i3 bindcode 87-90, 79-85)
bind = $mod, KP_End,   workspace, 1
bind = $mod, KP_Down,  workspace, 2
bind = $mod, KP_Next,  workspace, 3
bind = $mod, KP_Left,  workspace, 4
bind = $mod, KP_Begin, workspace, 5
bind = $mod, KP_Right, workspace, 6
bind = $mod, KP_Home,  workspace, 7
bind = $mod, KP_Up,    workspace, 8
bind = $mod, KP_Prior, workspace, 9
bind = $mod, KP_Insert, workspace, 10

# numpad, numlock ON (i3 handled this with the Mod2 duplicates)
bind = $mod, KP_1, workspace, 1
bind = $mod, KP_2, workspace, 2
bind = $mod, KP_3, workspace, 3
bind = $mod, KP_4, workspace, 4
bind = $mod, KP_5, workspace, 5
bind = $mod, KP_6, workspace, 6
bind = $mod, KP_7, workspace, 7
bind = $mod, KP_8, workspace, 8
bind = $mod, KP_9, workspace, 9
bind = $mod, KP_0, workspace, 10

bind = $mod SHIFT, KP_End,   movetoworkspace, 1
bind = $mod SHIFT, KP_Down,  movetoworkspace, 2
bind = $mod SHIFT, KP_Next,  movetoworkspace, 3
bind = $mod SHIFT, KP_Left,  movetoworkspace, 4
bind = $mod SHIFT, KP_Begin, movetoworkspace, 5
bind = $mod SHIFT, KP_Right, movetoworkspace, 6
bind = $mod SHIFT, KP_Home,  movetoworkspace, 7
bind = $mod SHIFT, KP_Up,    movetoworkspace, 8
bind = $mod SHIFT, KP_Prior, movetoworkspace, 9
bind = $mod SHIFT, KP_Insert, movetoworkspace, 10

# --- multi-monitor --------------------------------------------------------
# i3 had "move workspace to output next" / "... to output eDP". No eDP on a
# desktop, so both directions are next/previous monitor instead.
bind = $mod CTRL, k, movecurrentworkspacetomonitor, +1
bind = $mod CTRL, j, movecurrentworkspacetomonitor, -1

# --- session --------------------------------------------------------------
bind = $mod SHIFT, c, exec, hyprctl reload          # was i3 reload
bind = $mod SHIFT, e, exec, wlogout                 # was scripts/powermenu
bind = $mod SHIFT, x, exec, hyprlock               # was Mod4+Shift+l blur-lock
                                                    # NOTE: moved off SHIFT+l,
                                                    # which is now "move right"

# --- media ----------------------------------------------------------------
bindl  = , XF86AudioMute,        exec, wpctl set-mute   @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = $mod, XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%+
bindel = $mod, XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%-
bindl  = , XF86AudioPlay,  exec, playerctl play-pause
bindl  = , XF86AudioPause, exec, playerctl pause
bindl  = , XF86AudioNext,  exec, playerctl next
bindl  = , XF86AudioPrev,  exec, playerctl previous

# Monitor brightness over DDC/CI (desktop has no backlight, so not xbacklight)
bindel = , XF86MonBrightnessUp,   exec, ddcutil setvcp 10 + 5
bindel = , XF86MonBrightnessDown, exec, ddcutil setvcp 10 - 5

# --- screenshot -----------------------------------------------------------
bind = , Print,      exec, grim ~/$(date +%Y-%m-%d-%H%M%S)-screenshot.png
bind = SHIFT, Print, exec, grim -g "$(slurp)" ~/$(date +%Y-%m-%d-%H%M%S)-screenshot.png

# --- mouse ----------------------------------------------------------------
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# --- resize submap (i3 had this commented out; restored) ------------------
bind = $mod, r, submap, resize
submap = resize
binde = , h, resizeactive, -20 0
binde = , j, resizeactive, 0 20
binde = , k, resizeactive, 0 -20
binde = , l, resizeactive, 20 0
binde = , Left,  resizeactive, -20 0
binde = , Down,  resizeactive, 0 20
binde = , Up,    resizeactive, 0 -20
binde = , Right, resizeactive, 20 0
bind = , Return, submap, reset
bind = , Escape, submap, reset
submap = reset

# --- NOT CONVERTED --------------------------------------------------------
# $mod+Shift+r   i3 "restart in place" - no Hyprland equivalent; reload covers
#                config changes, and Hyprland cannot re-exec preserving layout.
# $mod+a         "focus parent" - dwindle has no parent-focus concept.
# $mod+Shift+n   scripts/empty_workspace - i3-specific (used i3-msg).
# $mod+p         switch-audio-port - X11/i3blocks specific; use Noctalia's
#                audio panel or `wpctl set-default`.
# $mod+Shift+p   scripts/power-profiles - rofi+X11; powerprofilesctl works but
#                the menu script does not.
# F1             scripts/keyhint-2 - rendered an X11 image of this cheat sheet.
# i3blocks pkill signals - i3blocks is not running; Noctalia owns the bar.
