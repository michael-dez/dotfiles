# bcpc -- Hyprland overrides on top of the CachyOS Noctalia defaults.
#
# This is an override fragment, NOT a full hyprland.conf. CachyOS's Hyprland
# edition ships its own config (cachyos-hypr-noctalia); replacing it wholesale
# loses the Noctalia integration. Instead add this at the END of the shipped
# ~/.config/hypr/hyprland.conf so it wins on the settings it names:
#
#     source = ~/.config/hypr/bcpc.conf
#
# Env vars belong here rather than in ~/.zshrc.bcpc: zshrc runs only for
# interactive shells, so anything exported there is invisible to GUI apps
# launched from the Noctalia launcher. Hyprland's `env =` applies to the whole
# session.

# --- Keyboard -------------------------------------------------------------
# Replaces the setxkbmap call in zshrc, which cannot work under Wayland.
input {
    kb_layout  = us
    kb_options = ctrl:nocaps
}

# --- NVIDIA ---------------------------------------------------------------
# 4070 Ti (Ada) on the open kernel modules. Deliberately NOT setting
# WLR_NO_HARDWARE_CURSORS or GBM_BACKEND: those are pre-explicit-sync advice
# and cause problems on current drivers.
env = LIBVA_DRIVER_NAME,nvidia
env = NVD_BACKEND,direct

# --- Toolkits -------------------------------------------------------------
env = MOZ_ENABLE_WAYLAND,1
env = QT_QPA_PLATFORM,wayland;xcb
# Stops Electron/Chromium flicker by forcing native Wayland.
env = ELECTRON_OZONE_PLATFORM_HINT,auto
