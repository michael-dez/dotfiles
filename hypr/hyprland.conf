# bcpc -- Hyprland main config.
#
# CachyOS has no cachyos-hyprland-settings package, so this file is ours rather
# than an override on a shipped one. Host-specific fragments are sourced at the
# bottom so they win over anything above.

# --- monitors -------------------------------------------------------------
# ZOWIE (540Hz, 1080p) on the LEFT, Alienware ultrawide on the RIGHT.
monitor = DP-3, 1920x1080@539.56, 0x0, 1
monitor = DP-1, 3440x1440@179.99, 1920x0, 1
monitor = , preferred, auto, 1

# Bind a workspace to the fast panel so games have somewhere to land.
workspace = 1, monitor:DP-3, default:true
workspace = 2, monitor:DP-1, default:true

# Workspace 11 is reserved for whatever is being streamed to Moonlight. The
# "sunshine" output it names is a headless one created on demand by
# ~/.config/sunshine/hooks/stream-start.sh, so it does NOT exist at startup and
# this rule sits inert until a client connects.
#
# gapsin/gapsout/border/rounding off: the stream should look like a dedicated
# game display, not a tiled desktop with chrome around the edges.
workspace = 11, monitor:sunshine, gapsin:0, gapsout:0, border:false, rounding:false, decorate:false

# A default mode for the virtual output. stream-start.sh overrides this with the
# client's actual mode, but `hyprctl reload` (bound to $mod SHIFT c) re-applies
# the config and the catch-all `monitor = , preferred, auto` above would
# otherwise reclaim the output at 1920x1080@60 -- resizing a live stream
# mid-session. Naming it here keeps a reload harmless.
monitor = sunshine, 1280x800@90, auto, 1

# NOTE: there is deliberately no windowrule making stream windows fullscreen.
# Hyprland 0.56 rewrote the rule syntax -- matchers now need a `match:` prefix,
# as in `windowrule = fullscreen true, match:class ^(kitty)$`, and a bare
# `workspace 11` silently parses as the workspace *effect* (move the window
# there) rather than a matcher. `match:class` and the `fullscreen` effect both
# work; `match:workspace` does not apply, at window-map time or on reload
# against a window already sitting on that workspace. Fullscreening on the
# stream output is therefore handled by hooks/stream-focus.py, which watches
# openwindow events instead. Do not re-attempt a match:workspace rule here.

env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland

misc {
    vrr = 0
    disable_hyprland_logo = true
}

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    layout = dwindle
}

exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = wl-paste --watch cliphist store
exec-once = noctalia -d

source = ~/.config/hypr/bcpc.conf
source = ~/.config/hypr/decoration.conf
source = ~/.config/hypr/keybinds.conf
