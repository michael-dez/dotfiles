# bcpc -- Hyprland main config.
#
# CachyOS has no cachyos-hyprland-settings package, so this file is ours rather
# than an override on a shipped one. Host-specific fragments are sourced at the
# bottom so they win over anything above.

# --- monitors -------------------------------------------------------------
# ZOWIE (540Hz, 1080p) on the LEFT, Alienware ultrawide on the RIGHT.
monitor = DP-3, 1920x1080@539.56, 0x0, 1
monitor = DP-1, 3440x1440@179.99, 1920x0, 1
monitor = , preferred, auto, 1

# Bind a workspace to the fast panel so games have somewhere to land.
workspace = 1, monitor:DP-3, default:true
workspace = 2, monitor:DP-1, default:true

env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland

misc {
    vrr = 0
    disable_hyprland_logo = true
}

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    layout = dwindle
}

exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = wl-paste --watch cliphist store
exec-once = noctalia -d

source = ~/.config/hypr/bcpc.conf
source = ~/.config/hypr/decoration.conf
source = ~/.config/hypr/keybinds.conf
