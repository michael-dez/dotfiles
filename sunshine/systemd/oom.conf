# bcpc -- keep one OOM-killed child from taking the whole unit down.
#   ->  ~/.config/systemd/user/app-dev.lizardbyte.app.Sunshine.service.d/oom.conf
#
# When Sunshine starts Steam itself -- the Big Picture app hook, as opposed to
# attaching to a Steam the desktop was already running -- everything Steam goes
# on to launch inherits this unit's cgroup. systemd defaults OOMPolicy to `stop`
# for services, so the kernel OOM-killing any one of those descendants stops the
# unit, taking Sunshine and the whole Steam tree with it. Nothing about the
# original kill required that.
#
# `continue` is what systemd already applies to scopes, which is why a Steam
# started from the desktop survives the same event and loses only the game.
[Service]
OOMPolicy=continue
