# bcpc -- Sunshine host config (symlinked; the Web UI rewrites it and drops comments). Restart to apply.
# Known limitations (shared input seat, no HDR) and the why of each setting: docs/streaming.md#sunshineconf
sunshine_name = bcpc

capture = wlr

output_name = sunshine

global_prep_cmd = [{"do":"/home/mike/.config/sunshine/hooks/ollama-suspend.sh","undo":"/home/mike/.config/sunshine/hooks/ollama-resume.sh"},{"do":"/home/mike/.config/sunshine/hooks/stream-start.sh","undo":"/home/mike/.config/sunshine/hooks/stream-end.sh"}]

encoder = nvenc

nvenc_preset = 1
nvenc_twopass = quarter_res
nvenc_spatial_aq = enabled

min_threads = 4

# virtual_sink is deliberately unset (no-op on Linux)
audio_sink = sunshine-stream

# must stay disabled: Right Alt is the Hyprland $mod
key_rightalt_to_key_win = disabled

# x360, not ds5: ds5 has a hidraw node Steam Input and Proton contend over
gamepad = x360
