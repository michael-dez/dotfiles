# bcpc -- Sunshine host config, streamed to a handheld client over Moonlight.
#
# Linked from this repo by install.yml. Sunshine's Web UI writes through the
# symlink, so anything changed there lands in `git status` instead of drifting
# away silently -- but it also rewrites the whole file and drops these
# comments, so prefer editing here.
#
# Sunshine only reads this at startup: `systemctl --user restart sunshine`
# after changing it.
#
# --- known limitations, so they don't get "fixed" later -------------------
#
# Keyboard and mouse are a SHARED SEAT. Sunshine injects input through uinput
# as vendor beef, product dead ("Keyboard passthrough", "Mouse passthrough"),
# which lands in the same Hyprland seat as the physical keyboard. Hyprland has
# one seat and one keyboard focus with no per-device routing, so typing at the
# desk mid-stream reaches the streamed game and vice versa. Only video, audio,
# and app-launch focus are isolated here. Separating input needs a second
# compositor session, which Hyprland cannot host: it requests the DRM backend
# unconditionally and has no headless-only mode.
#
# HDR is unavailable. wlr-screencopy carries no HDR metadata, so with
# capture = wlr, hevc_mode = 3 would advertise HDR without delivering it.

sunshine_name = bcpc

# --- capture --------------------------------------------------------------
# wlr, not the KMS default: KMS capture enumerates DRM connectors and cannot
# see a compositor-side headless output at all, which is exactly what this
# config streams.
capture = wlr

# The virtual output created on connect by hooks/stream-start.sh, sized to the
# client. Matched by name -- Sunshine compares output_name against each
# output's name before falling back to treating it as an index.
#
# Without this, Sunshine defaults to monitors[0], which is whichever display
# happens to enumerate first, regardless of where anything is running.
output_name = sunshine

# Two pairs, run in array order on connect and in reverse on disconnect.
# ollama first, so the GPU is handed over before the virtual output exists and
# the app launches -- ollama.socket is armed for the whole LAN, so a model can
# be loaded at any moment right up until this stops it. Its resume therefore
# runs last on the way out, once the stream is fully torn down.
#
# A prep cmd that exits non-zero aborts the launch; both of these exit 0
# unconditionally, so neither pair can cost a stream.
#
# stream-start.sh also reads SUNSHINE_APP_NAME here and puts the stream into
# game or desktop mode before the virtual output exists -- the Deck taps "Steam
# Big Picture" and gets a dedicated game display; BCLT taps "Desktop" and gets
# an ordinary workspace it can work in. See sunshine/README.md.
global_prep_cmd = [{"do":"/home/mike/.config/sunshine/hooks/ollama-suspend.sh","undo":"/home/mike/.config/sunshine/hooks/ollama-resume.sh"},{"do":"/home/mike/.config/sunshine/hooks/stream-start.sh","undo":"/home/mike/.config/sunshine/hooks/stream-end.sh"}]

# --- video ----------------------------------------------------------------
# Pinned rather than probed, so a driver update cannot quietly demote the
# stream to software encoding.
encoder = nvenc

# P1: the lowest-latency NVENC preset. Handheld-resolution streams leave plenty
# of quality headroom, and latency is the thing actually worth spending on
# here. Despite the docs filing the nvenc_* options under Windows, these three
# feed config::video.nv_legacy, which the Linux ffmpeg NVENC path reads too.
nvenc_preset = 1
nvenc_twopass = quarter_res
# Costs little at this resolution and visibly helps dark scenes, where a flat
# quantizer wastes bits on noise and starves the shadows.
nvenc_spatial_aq = enabled

# Above the default of 2: more threads for packet handling, which the host has
# to spare.
min_threads = 4

# Left at defaults on purpose:
#   fec_percentage  20 -- a wireless client needs the redundancy
#   hevc_mode/av1_mode 0 -- let the client negotiate; modern handhelds decode both

# --- audio ----------------------------------------------------------------
# Capture our own null sink (see pipewire/sunshine-sink.conf) instead of
# whatever happens to be the default output. Streamed apps are pointed at it
# via PULSE_SINK in apps.json.
audio_sink = sunshine-stream

# virtual_sink is UNSET because on Linux it does nothing. This build renders
# that input only inside the Web UI's "windows" platform slot
# (/usr/share/sunshine/web), so it is a Windows option however it reads.
#
# Setting it would not have helped anyway, because Sunshine moves the system
# default sink on its own, unasked, on every stream:
#
#     Info: config: 'audio_sink' = sunshine-stream
#     Info: Setting default sink to: [sink-sunshine-stereo]
#     Info: Found default monitor by name: sunshine-stream.monitor
#
# Note the two different sinks. It captures the one named above and makes a
# sink of its own the default, so for the length of a stream anything that
# follows the default plays where nobody is listening. A game stream never
# noticed -- apps.json pins the launched app with PULSE_SINK -- but a desktop
# stream launches everything afterwards, from the compositor, with no such pin.
# hooks/desktop-audio.sh is what repairs that, and only for desktop streams.

# --- input ----------------------------------------------------------------
# Must stay disabled. hypr/bcpc.conf sets kb_options=lv3:ralt_switch, making
# Right Alt the Hyprland $mod for every binding in keybinds.conf. Remapping it
# to Super on the way in would break all of them from the client.
key_rightalt_to_key_win = disabled

# Pinned rather than left on auto, so the pad's identity stays stable across
# reconnects and games don't re-detect a different controller mid-session and
# lose their bindings.
#
# x360, NOT ds5. Sunshine backs DualSense emulation with a uhid device, which
# carries a /dev/hidraw node; x360 is plain uinput evdev with no hidraw at all.
# That distinction is the whole reason for this line. Steam Input and Proton's
# winedevice both open a DualSense by hidraw, and with Steam Input forced on for
# a title they hold the same node at once -- observed as steam and winedevice.exe
# each holding /dev/hidraw15 -- so HID reports go to whichever reader gets there
# first and the controls die. No hidraw node, nothing to contend over.
#
# Nothing is lost here: ds5 was chosen for motion and touchpad, and the client
# reports neither. Sunshine says so on every single connect --
#   "Gamepad 0 is emulating a motion-capable controller, but the client gamepad
#    does not have motion sensors active"
#   "Gamepad 0 is emulating a touchpad-capable controller, but the client
#    gamepad does not have a touchpad"
# so the DualSense capabilities were being advertised and never filled.
#
# If a client that does report motion ever streams from here, ds5 becomes worth
# reconsidering -- but then disable Steam Input per-game rather than letting two
# processes share the hidraw node.
gamepad = x360

# Gamepad isolation is currently a no-op: there is no physical controller on
# the host, so the client's virtual pad is the only one any game can see. If
# one is ever plugged in at the desk, hide it from streamed games by adding
# SDL_GAMECONTROLLER_IGNORE_DEVICES=0xVID/0xPID to the "env" block in
# apps.json (JSON takes no comments, hence the note living here).
