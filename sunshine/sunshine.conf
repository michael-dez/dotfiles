# bcpc -- Sunshine host config, streamed to a handheld client over Moonlight.
#
# Linked from this repo by install.yml. Sunshine's Web UI writes through the
# symlink, so anything changed there lands in `git status` instead of drifting
# away silently -- but it also rewrites the whole file and drops these
# comments, so prefer editing here.
#
# Sunshine only reads this at startup: `systemctl --user restart sunshine`
# after changing it.
#
# --- known limitations, so they don't get "fixed" later -------------------
#
# Keyboard and mouse are a SHARED SEAT. Sunshine injects input through uinput
# as vendor beef, product dead ("Keyboard passthrough", "Mouse passthrough"),
# which lands in the same Hyprland seat as the physical keyboard. Hyprland has
# one seat and one keyboard focus with no per-device routing, so typing at the
# desk mid-stream reaches the streamed game and vice versa. Only video, audio,
# and app-launch focus are isolated here. Separating input needs a second
# compositor session, which Hyprland cannot host: it requests the DRM backend
# unconditionally and has no headless-only mode.
#
# HDR is unavailable. wlr-screencopy carries no HDR metadata, so with
# capture = wlr, hevc_mode = 3 would advertise HDR without delivering it.

sunshine_name = bcpc

# --- capture --------------------------------------------------------------
# wlr, not the KMS default: KMS capture enumerates DRM connectors and cannot
# see a compositor-side headless output at all, which is exactly what this
# config streams.
capture = wlr

# The virtual output created on connect by hooks/stream-start.sh, sized to the
# client. Matched by name -- Sunshine compares output_name against each
# output's name before falling back to treating it as an index.
#
# Without this, Sunshine defaults to monitors[0], which is whichever display
# happens to enumerate first, regardless of where anything is running.
output_name = sunshine

global_prep_cmd = [{"do":"/home/mike/.config/sunshine/hooks/stream-start.sh","undo":"/home/mike/.config/sunshine/hooks/stream-end.sh"}]

# --- video ----------------------------------------------------------------
# Pinned rather than probed, so a driver update cannot quietly demote the
# stream to software encoding.
encoder = nvenc

# P1: the lowest-latency NVENC preset. Handheld-resolution streams leave plenty
# of quality headroom, and latency is the thing actually worth spending on
# here. Despite the docs filing the nvenc_* options under Windows, these three
# feed config::video.nv_legacy, which the Linux ffmpeg NVENC path reads too.
nvenc_preset = 1
nvenc_twopass = quarter_res
# Costs little at this resolution and visibly helps dark scenes, where a flat
# quantizer wastes bits on noise and starves the shadows.
nvenc_spatial_aq = enabled

# Above the default of 2: more threads for packet handling, which the host has
# to spare.
min_threads = 4

# Left at defaults on purpose:
#   fec_percentage  20 -- a wireless client needs the redundancy
#   hevc_mode/av1_mode 0 -- let the client negotiate; modern handhelds decode both

# --- audio ----------------------------------------------------------------
# Capture our own null sink (see pipewire/sunshine-sink.conf) instead of
# whatever happens to be the default output. Streamed apps are pointed at it
# via PULSE_SINK in apps.json.
audio_sink = sunshine-stream

# virtual_sink is deliberately UNSET. It looks like the option for this, but it
# makes Sunshine call pa_context_set_default_sink -- it moves the system
# default onto the capture sink while streaming, so the desktop goes silent and
# desktop audio leaks into the stream. That is the opposite of what this config
# is for.

# --- input ----------------------------------------------------------------
# Must stay disabled. hypr/bcpc.conf sets kb_options=lv3:ralt_switch, making
# Right Alt the Hyprland $mod for every binding in keybinds.conf. Remapping it
# to Super on the way in would break all of them from the client.
key_rightalt_to_key_win = disabled

# Pinned to what auto-detection already selects for a client reporting motion
# sensors. Pinning keeps the pad's identity stable across reconnects, so games
# don't re-detect a different controller mid-session and lose their bindings.
gamepad = ds5

# Gamepad isolation is currently a no-op: there is no physical controller on
# the host, so the client's virtual pad is the only one any game can see. If
# one is ever plugged in at the desk, hide it from streamed games by adding
# SDL_GAMECONTROLLER_IGNORE_DEVICES=0xVID/0xPID to the "env" block in
# apps.json (JSON takes no comments, hence the note living here).
