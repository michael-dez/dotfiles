# bcpc -- kitty. Translucency here, not a Hyprland rule; colors.conf then the generated noctalia.conf (order matters).
# Why: docs/hyprland.md#kitty

background_opacity 0.75

background         #262626
foreground         #d4d4d4
cursor             #d4d4d4
selection_background #3a3a3a
selection_foreground #e8e8e8

font_family        MesloLGS Nerd Font
font_size          15.0
scrollback_lines   10000
enable_audio_bell  no
copy_on_select yes
window_padding_width 4

include colors.conf
include themes/noctalia.conf
