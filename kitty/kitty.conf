# bcpc -- kitty
#
# Background translucency is set HERE rather than with a Hyprland
# `windowrule opacity`, because that rule dims the whole surface including the
# text. This way only the background is translucent and glyphs stay opaque;
# Hyprland blurs whatever shows through (see hypr/decoration.conf).

background_opacity 0.85

# Neutral greys -- no blue or warm cast, so it sits under any Noctalia palette.
background         #262626
foreground         #d4d4d4
cursor             #d4d4d4
selection_background #3a3a3a
selection_foreground #e8e8e8

font_family        MesloLGS Nerd Font
font_size          15.0
scrollback_lines   10000
enable_audio_bell  no
window_padding_width 4

# Two includes, in this order, and the order is the whole point.
#
# colors.conf is a static Gogh export of Iceberg, checked into this repo. It is
# the fallback: on a freshly provisioned machine it gives kitty the right colors
# before Noctalia has ever run its templates.
#
# themes/noctalia.conf is generated by Noctalia's built-in kitty template every
# time the active palette changes, and is deliberately NOT in this repo -- it is
# output, not config. Coming last, it wins, so kitty tracks whatever palette
# Noctalia is on. With the Iceberg custom palette active the two files agree
# exactly; switch Noctalia to another palette and this is what retints kitty.
#
# A missing include is only a warning to kitty ("Could not find included config
# file ..., ignoring"), not an error, so the second line is harmless on a box
# where Noctalia has not applied templates yet.
include colors.conf
include themes/noctalia.conf
