# bcpc -- kitty
#
# Background translucency is set HERE rather than with a Hyprland
# `windowrule opacity`, because that rule dims the whole surface including the
# text. This way only the background is translucent and glyphs stay opaque;
# Hyprland blurs whatever shows through (see hypr/decoration.conf).

background_opacity 0.90

# Neutral greys -- no blue or warm cast, so it sits under any Noctalia palette.
background         #262626
foreground         #d4d4d4
cursor             #d4d4d4
selection_background #3a3a3a
selection_foreground #e8e8e8

font_family        MesloLGS Nerd Font
font_size          15.0
scrollback_lines   10000
enable_audio_bell  no
window_padding_width 4
