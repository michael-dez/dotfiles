# bcpc -- MangoHud overlay. Toggle with Shift_R+F12.
# VRAM and package temps are surfaced deliberately: 12GB is the binding
# constraint on this GPU, and thermals are worth watching on this CPU.

fps
frametime
frame_timing=1

gpu_stats
gpu_temp
gpu_power
vram

cpu_stats
cpu_temp
cpu_power
ram

engine_version
vulkan_driver
resolution

position=top-left
font_size=20
background_alpha=0.4
toggle_hud=Shift_R+F12
toggle_logging=Shift_L+F2
