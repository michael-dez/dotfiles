# Configures WSL Ubuntu, EndeavourOS (BCLT) and CachyOS (bcpc) environments.
# Install requirements: ansible-galaxy collection install community.general
# Run with: ansible-playbook -K install.yml
- hosts: localhost
  connection: local
  become: no
  gather_facts: yes
  vars:
    username: "{{ ansible_user_id }}"
    # ansible_distribution reports "Archlinux" on every Arch derivative that
    # ships /etc/arch-release, so it cannot tell the hosts apart. Reading ID
    # from /etc/os-release does not help either: CachyOS ships Arch's own
    # os-release verbatim, ID=arch and all, so that check silently skipped
    # every bcpc task it guarded. The mirrorlist dropped in by the
    # cachyos-mirrorlist package is present on any CachyOS install and on no
    # plain Arch or EndeavourOS one, which makes it the honest marker.
    is_cachyos: "{{ '/etc/pacman.d/cachyos-mirrorlist' is exists }}"
    packages:
      - build-essential
      - curl
      - git
      - tmux
      - unzip
      - wget
      - zsh
      - npm
  tasks:
    - name: "Arch: Upgrade all installed packages"
      when: ansible_facts['distribution'] == 'Archlinux'
      become: yes
      pacman:
        update_cache: yes
        upgrade: yes

    # Per-host manifest. The unsuffixed bak/pacman-export.txt is an
    # EndeavourOS X11/i3/LightDM list; installing it on bcpc would drag a
    # second display manager onto a Hyprland box. zshrc writes
    # pacman-export-<hostname>.txt, and this only restores a matching one.
    - name: "Arch: Look for this host's package manifest"
      when: ansible_facts['os_family'] == 'Archlinux'
      stat:
        path: "{{ playbook_dir }}/bak/pacman-export-{{ ansible_hostname }}.txt"
      register: pkglist

    - name: "Arch: Install from this host's package list"
      when:
        - ansible_facts['os_family'] == 'Archlinux'
        - pkglist.stat.exists | default(false)
      become: yes
      package:
        name: "{{ item }}"
        state: latest
      with_items: "{{ lookup('file', pkglist.stat.path).splitlines() }}"

    - name: "Ubuntu: Update apt cache, install dependencies and upgrade all installed packages"
      when: ansible_facts['distribution'] == 'Ubuntu'
      become: yes
      apt:
        update_cache: yes
        state: latest
        name: "{{ packages }}"

    - name: "Ubuntu: Install brew"
      become: no
      when: ansible_facts['distribution'] == 'Ubuntu'
      shell: NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
      args:
        creates: /home/linuxbrew/.linuxbrew

    - name: "Ubuntu: Add brew to PATH"
      become: no
      when: ansible_facts['distribution'] == 'Ubuntu'
      lineinfile:
        path: /home/{{ username }}/.bashrc
        line: 'eval /home/linuxbrew/.linuxbrew/bin/brew shellenv'

    - name: "Ubuntu: Add hashicorp tap for packer"
      become: no
      when: ansible_facts['distribution'] == 'Ubuntu'
      shell: /home/linuxbrew/.linuxbrew/bin/brew tap hashicorp/tap
      args:
        creates: "/home/linuxbrew/.linuxbrew/Library/Taps/hashicorp/homebrew-tap"

    - name: "Ubuntu: Install brew packages"
      become: no
      when: ansible_facts['distribution'] == 'Ubuntu'
      shell: /home/linuxbrew/.linuxbrew/bin/brew install {{ item.package }}
      args:
        creates: "/home/linuxbrew/.linuxbrew/bin/{{ item.binary }}"
      with_items:
        - { package: "nvim", binary: "nvim" }
        - { package: "terraform", binary: "terraform" }
        - { package: "fzf", binary: "fzf" }
        - { package: "ripgrep", binary: "rg" }
        - { package: "azure-cli", binary: "az" }
        - { package: "hashicorp/tap/packer", binary: "packer" }

    - name: "Install npm packages globally"
      become: no
      npm:
        name: "{{ item }}"
        state: present
        path: /home/{{ username }}/.local
      with_items:
        - yarn

    # Dotfile symlinking tasks
    # playbook_dir, not ansible_env.PWD: PWD is wherever you invoked
    # ansible-playbook from, so running it outside the repo produced symlinks
    # pointing at paths that do not exist.
    - name: "Create symlinks for home directory dotfiles"
      become: no
      file:
        src: "{{ playbook_dir }}/{{ item }}"
        dest: "{{ ansible_env.HOME }}/.{{ item }}"
        state: link
        force: yes
      with_items:
        - vimrc
        - tmux.conf
        - zshenv
        - zshrc
        - p10k.zsh

    - name: "Create config directories for XDG config files"
      become: no
      file:
        path: "{{ ansible_env.HOME }}/.config/{{ item }}"
        state: directory
        mode: '0755'
      with_items:
        - nvim
        - picom
        - texinfo
        - xfce4/terminal
        - xfce4/xfconf/xfce-perchannel-xml

    - name: "Create symlinks for XDG config files"
      become: no
      file:
        src: "{{ playbook_dir }}/{{ item.src }}"
        dest: "{{ ansible_env.HOME }}/.config/{{ item.dest }}"
        state: link
        force: yes
      with_items:
        - { src: "nvim/init.lua", dest: "nvim/init.lua" }
        - { src: "picom/picom.conf", dest: "picom/picom.conf" }
        - { src: "picom/picom-animations.conf", dest: "picom/picom-animations.conf" }
        - { src: "texinfo/infokey", dest: "texinfo/infokey" }
        - { src: "xfce4/terminal/terminalrc", dest: "xfce4/terminal/terminalrc" }
        - { src: "xfce4/terminal/accels.scm", dest: "xfce4/terminal/accels.scm" }
        - { src: "xfce4/xfconf/xfce-perchannel-xml/xfce4-terminal.xml", dest: "xfce4/xfconf/xfce-perchannel-xml/xfce4-terminal.xml" }

    # --- bcpc / CachyOS only: Wayland desktop configs ---------------------
    # Guarded on is_cachyos; see the comment on that var for why the obvious
    # os-release check does not work. No-op on WSL and EndeavourOS.
    - name: "bcpc: Create config directories for Wayland desktop"
      become: no
      when: is_cachyos | bool
      file:
        path: "{{ ansible_env.HOME }}/.config/{{ item }}"
        state: directory
        mode: '0755'
      with_items:
        - hypr
        - mangohud
        - kitty
        - sunshine
        - sunshine/hooks
        - pipewire/pipewire.conf.d

    - name: "bcpc: Symlink per-host shell config"
      become: no
      when: is_cachyos | bool
      file:
        src: "{{ playbook_dir }}/zshrc.bcpc"
        dest: "{{ ansible_env.HOME }}/.zshrc.local"
        state: link
        force: yes

    - name: "bcpc: Symlink Wayland desktop configs"
      become: no
      when: is_cachyos | bool
      file:
        src: "{{ playbook_dir }}/{{ item.src }}"
        dest: "{{ ansible_env.HOME }}/.config/{{ item.dest }}"
        state: link
        force: yes
      with_items:
        - { src: "hypr/hyprland.conf", dest: "hypr/hyprland.conf" }
        - { src: "hypr/bcpc.conf", dest: "hypr/bcpc.conf" }
        - { src: "hypr/keybinds.conf", dest: "hypr/keybinds.conf" }
        - { src: "hypr/decoration.conf", dest: "hypr/decoration.conf" }
        - { src: "kitty/kitty.conf", dest: "kitty/kitty.conf" }
        - { src: "mangohud/MangoHud.conf", dest: "mangohud/MangoHud.conf" }
        # Sunshine rewrites sunshine.conf and apps.json when saved from its Web
        # UI. Linking rather than copying means those edits write through into
        # this repo and show up in `git status`, instead of drifting silently.
        # sunshine_state.json and credentials/ are deliberately NOT linked:
        # they hold the Web UI password hash and paired client certificates,
        # and this repo is published.
        - { src: "sunshine/sunshine.conf", dest: "sunshine/sunshine.conf" }
        - { src: "sunshine/apps.json", dest: "sunshine/apps.json" }
        - { src: "sunshine/hooks/hyprctl-env.sh", dest: "sunshine/hooks/hyprctl-env.sh" }
        - { src: "sunshine/hooks/stream-start.sh", dest: "sunshine/hooks/stream-start.sh" }
        - { src: "sunshine/hooks/stream-end.sh", dest: "sunshine/hooks/stream-end.sh" }
        - { src: "sunshine/hooks/stream-focus.py", dest: "sunshine/hooks/stream-focus.py" }
        - { src: "sunshine/hooks/launch-bigpicture.sh", dest: "sunshine/hooks/launch-bigpicture.sh" }
        - { src: "pipewire/sunshine-sink.conf", dest: "pipewire/pipewire.conf.d/sunshine-sink.conf" }

    # Sunshine logs "setpriority failed for nice -15: Permission denied" on
    # every stream because RLIMIT_NICE is 0 for ordinary users, so it cannot
    # raise its capture and encode threads above normal priority -- which shows
    # up as frame pacing jitter under load. CachyOS already ships
    # /etc/security/limits.d/10-gamemode.conf granting "@gamemode - nice -10",
    # so joining the group is the whole fix. Takes effect at next login.
    - name: "bcpc: Add user to the gamemode group so Sunshine can raise thread priority"
      become: yes
      when: is_cachyos | bool
      user:
        name: "{{ username }}"
        groups: gamemode
        append: yes

    - name: "Change user shell to zsh"
      become: yes
      user:
        name: "{{ username }}"
        shell: /usr/bin/zsh

    - name: "Ubuntu: Add brew to PATH"
      become: no
      when: ansible_facts['distribution'] == 'Ubuntu'
      lineinfile:
        path: /home/{{ username }}/.zshrc
        line: 'eval $(/home/linuxbrew/.linuxbrew/bin/brew shellenv)'
