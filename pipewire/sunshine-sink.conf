# bcpc -- null sink that exists only to be captured by Sunshine.  ->  ~/.config/pipewire/pipewire.conf.d/
# Why a static sink, context.objects not modules: docs/streaming.md#pipewire-sink
context.objects = [
    {   factory = adapter
        args = {
            factory.name     = support.null-audio-sink
            node.name        = "sunshine-stream"
            node.description = "Sunshine Stream"
            media.class      = Audio/Sink
            audio.position   = [ FL FR ]
            audio.rate       = 48000
            monitor.channel-volumes = true
        }
    }
]
