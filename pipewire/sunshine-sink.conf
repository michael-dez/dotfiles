# bcpc -- a null sink that exists only to be captured by Sunshine.
#
# Linked to ~/.config/pipewire/pipewire.conf.d/ by install.yml.
#
# Sunshine captures the monitor of whatever sink `audio_sink` names. Pointing
# it at a sink of our own, and launching streamed apps with
# PULSE_SINK=sunshine-stream (see sunshine/apps.json), keeps the stream's audio
# and the desktop's audio on separate paths: the client hears the game, the
# desk keeps its headset, and neither one hears the other.
#
# Sunshine can create null sinks itself, but the `virtual_sink` option that
# does so also calls pa_context_set_default_sink -- it moves the SYSTEM default
# onto the capture sink for the duration of the stream, which silences the
# desktop. Owning the sink here avoids that entirely; see sunshine.conf.
#
# This is a static sink rather than one created on connect so its ID stays put
# across streams, which matters for anything that remembers a per-app routing.

# context.objects, not context.modules: the adapter factory is already loaded
# by the stock config, and asking for it again here loads nothing.
context.objects = [
    {   factory = adapter
        args = {
            factory.name     = support.null-audio-sink
            node.name        = "sunshine-stream"
            node.description = "Sunshine Stream"
            media.class      = Audio/Sink
            audio.position   = [ FL FR ]
            # 48kHz matches what Sunshine encodes with Opus, so nothing has to
            # resample on the way out.
            audio.rate       = 48000
            monitor.channel-volumes = true
        }
    }
]
