# bcpc -- compressed swap in RAM.  ->  /etc/systemd/zram-generator.conf
#
# This host had no swap of any kind: no partition, no swapfile, no zram. That
# is not the CachyOS default -- cachyos-settings ships a zram-generator config
# and the installer suppresses the disk-swap question because zram is meant to
# cover it. bcpc was built by hand rather than by the graphical installer, so
# cachyos-settings never landed and only the "no disk swap" half of that policy
# took effect.
#
# Why no swap is worse than a little swap, rather than neutral: anonymous pages
# are reclaimable only if there is somewhere to put them. With no swap the
# kernel's sole reclaim target is file-backed memory -- which, once the page
# cache is gone, means the running executables' own text pages. It evicts them,
# the process immediately faults them back off the NVMe, and the kernel scores
# that as forward progress, so the OOM killer stays holstered while everything
# grinds. Swap does not merely add capacity here; it gives reclaim a target
# that is not your executables, which is what breaks that loop.
#
# zram-size: cachyos-settings uses `ram`. Halved here on purpose. Compressed
# pages live in real memory, so the device size is the ceiling on how much
# physical RAM swap can consume in the worst case, and half is already far more
# headroom than breaking the loop above requires. Raise it for parity if a
# workload ever wants it -- it is a one-line change needing no other tuning.
#
# Sizing caveat worth keeping in mind: a leak larger than the device just fills
# it and puts you back where you started, later. zram widens the margin, it
# does not remove the failure mode -- see earlyoom for the layer that does.
#
# zstd because it is what the rest of this system already compresses with (see
# the btrfs compress=zstd:3 mounts in /etc/fstab).
[zram0]
zram-size = ram / 2
compression-algorithm = zstd
swap-priority = 100
fs-type = swap
