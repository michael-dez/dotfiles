# bcpc -- NVIDIA module options that are ours rather than the distro's.
#                                    ->  /etc/modprobe.d/nvidia-bcpc.conf
#
# The filename is load-bearing, which is the whole reason this file exists as a
# tracked artifact instead of the hand-written /etc/modprobe.d/nvidia.conf it
# replaces. modprobe reads /etc/modprobe.d, /run/modprobe.d and
# /usr/lib/modprobe.d, and per modprobe.d(5) "a file of the same name in
# subsequent directories is ignored" -- /etc wins on an exact name match, and
# wins by suppressing the other file entirely rather than by merging with it.
#
# cachyos-settings ships /usr/lib/modprobe.d/nvidia.conf. A local file called
# nvidia.conf therefore does not override one setting from it, it deletes the
# whole file from consideration. The old hand-written one predated the package
# by long enough that nothing had ever noticed: with cachyos-settings absent
# there was no file to collide with, so it shadowed nothing and looked fine.
# Installing the package is what would have sprung it.
#
# So: any name except nvidia.conf. `-bcpc` also sorts before `nvidia.conf`
# ('-' is 0x2D, '.' is 0x2E) and files are read in lexicographic order across
# all three directories, which is worth knowing but does not matter here --
# nothing below names a parameter cachyos-settings also names, so there is no
# last-writer-wins race to reason about.

# --- what is deliberately NOT here ------------------------------------------
# NVreg_InitializeSystemMemoryAllocations is left to cachyos-settings, which
# sets it to 0 (the driver default is 1). At 1 the driver zeroes every system
# memory allocation before handing it over, and writing to a page is what makes
# it resident -- so pool slabs the GPU barely touches still count fully against
# RSS. That is the mechanism behind Overwatch sitting at ~18.5GiB with ~12.5GiB
# of it host-side, write-once, never read again.
#
# Taking the distro value rather than setting it here is the point. It is a
# real security relaxation -- freed memory is no longer cleared before the GPU
# can see it -- and owning that decision locally would mean re-litigating it at
# every driver bump. To opt back out, add
# NVreg_InitializeSystemMemoryAllocations=1 to the options line below; being in
# this file is sufficient to win, no rename needed.
#
# Also not here: `options nvidia_drm modeset=1`, which the old file carried.
# `modinfo nvidia_drm` on 610.57.04 reports "1 = enable (default)", so the line
# only restated the default. If a future driver ever flips that, the symptom is
# a dead Wayland session at the next boot -- obvious, and revertible from a TTY
# by putting the line back.

# --- what is ours -----------------------------------------------------------
# Save VRAM contents to NVreg_TemporaryFilePath across suspend instead of
# letting them be discarded. nvidia-utils already ships part of this plumbing
# in /usr/lib/modprobe.d/nvidia-sleep.conf (NVreg_UseKernelSuspendNotifiers=1,
# NVreg_TemporaryFilePath=/var/tmp) -- a differently-named file, so it merges
# with this one rather than being shadowed. This layers VRAM preservation on
# top of it. Kept rather than dropped as presumed-redundant: the two are
# related but not verified interchangeable, and a resume that comes back to a
# corrupted framebuffer is a bad way to find out.
options nvidia NVreg_PreserveVideoMemoryAllocations=1
