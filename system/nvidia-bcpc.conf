# bcpc -- NVIDIA module options.  ->  /etc/modprobe.d/nvidia-bcpc.conf
# Must NOT be named nvidia.conf: it would shadow cachyos-settings' file of that
# name. Also why InitializeSystemMemoryAllocations and modeset are absent:
# docs/system.md#nvidia-modprobe-options
options nvidia NVreg_PreserveVideoMemoryAllocations=1
