# bcpc -- enable the Magic SysRq keys worth having.
#
# Arch ships kernel.sysrq = 16 in /usr/lib/sysctl.d/50-default.conf, which is
# the sync command and nothing else.
#
# The one that matters is bit 64. SysRq is handled inside the kernel's own
# input path, so it still works when userspace is too starved to schedule --
# the case where every ordinary escape route, compositor keybinds included, has
# already stopped responding. Alt+SysRq+F invokes the OOM killer on the spot
# and is the difference between a wedged machine and a lost session.
#
# 244 = 4 + 16 + 32 + 64 + 128:
#     4  keyboard control (SAK, unraw)
#    16  sync                      <- the stock Arch default, on its own
#    32  remount read-only
#    64  signalling of processes   <- Alt+SysRq+F lives here
#   128  reboot / poweroff
#
# Deliberately not 1 ("everything"): that adds bit 8, debugging dumps, which
# spray task backtraces into the journal on a keypress. 244 is the set that
# makes REISUB work and nothing more.
#
# Note the asymmetry, because it is easy to be caught out by it: this mask
# gates only the *keyboard*. Writes to /proc/sysrq-trigger by root are always
# permitted whatever the value here, so `echo f | sudo tee /proc/sysrq-trigger`
# over SSH works even at the stock 16.
kernel.sysrq = 244
