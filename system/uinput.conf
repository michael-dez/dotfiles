# bcpc -- load uinput at boot, not on first stream.
#                                    ->  /etc/modules-load.d/uinput.conf
#
# Every input device Sunshine creates for a client -- gamepad, keyboard, mouse,
# touchscreen -- is a uinput device. uinput is built as a module
# (CONFIG_INPUT_UINPUT=m) and is otherwise only autoloaded when something first
# opens /dev/uinput, which on this host means the first stream after a boot.
#
# That lazy load is the trap. A kernel upgrade replaces
# /usr/lib/modules/<running version> with the new version's directory, so from
# the upgrade until the next reboot the running kernel can load no module it
# has not already loaded. Stream for the first time in that window and the open
# fails with ENODEV even though /dev/uinput (a static node) is right there:
#
#   Warning: create libvirtualhid gamepad: failed to open uinput device: No such device
#
# Video and audio still work, so it looks like the Deck's input is being
# ignored. Loading at boot means the module is already resident before any
# upgrade can remove it.
uinput
