# bcpc -- ollama settings.  ->  /etc/systemd/system/ollama.service.d/override.conf
# No $ in ExecStartPost (systemd expands it). Why each setting: docs/llm.md#ollama-overrideconf

[Service]
Environment="OLLAMA_HOST=127.0.0.1:11435"
Environment="OLLAMA_MAX_LOADED_MODELS=1"
Environment="OLLAMA_KEEP_ALIVE=5m"

OOMScoreAdjust=200

ExecStartPost=/usr/bin/bash -c 'until curl -sf -o /dev/null http://127.0.0.1:11435/; do sleep 0.2; done'
TimeoutStartSec=60
