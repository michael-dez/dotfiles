# bcpc -- ollama's own settings, on a host that is also a GPU streamer.
#   ->  /etc/systemd/system/ollama.service.d/override.conf
#
# A drop-in rather than an edit to /usr/lib/systemd/system/ollama.service, which
# pacman owns and rewrites on every ollama upgrade. Everything the packaged unit
# already gets right -- User=ollama, OLLAMA_MODELS=/var/lib/ollama,
# ProtectSystem=full, Restart=on-failure -- is inherited untouched.
#
# OLLAMA_HOST moves ollama off its default 11434 and onto 11435, because
# ollama.socket now owns 11434. Two things would otherwise try to bind the same
# port and the second would fail. Both are loopback-only, so neither is
# reachable from off-box; 11434 is the one clients are expected to use, since it
# is the port every ollama client assumes when OLLAMA_HOST is unset.
#
# OLLAMA_MAX_LOADED_MODELS=1 is about a 12 GB card, not about ollama. The
# default lets a second model load beside the first whenever ollama thinks the
# VRAM fits, and "fits" is computed against a free-VRAM figure that does not
# know a game is about to want 8 GB of it. One model at a time means at most one
# model's worth of VRAM is ever held.
#
# OLLAMA_KEEP_ALIVE=5m is ollama's own default, restated here because it is load
# bearing on this host and should not change silently under an upgrade: it is
# what returns the VRAM without anyone asking. The Sunshine hooks
# (hooks/ollama-suspend.sh) handle the case where five minutes is too long to
# wait -- a stream starting now -- by stopping the service outright.
#
# OOMScoreAdjust=200 covers both killers with one number. earlyoom ranks
# candidates by /proc/*/oom_score, which oom_score_adj feeds directly, so this
# makes ollama a preferred victim there as well as under the kernel's own OOM
# killer -- without having to name it in earlyoom-override.conf's --prefer
# regex. Right ordering for this box: a killed ollama costs a re-run of a
# prompt, while the desktop and Sunshine losing the same fight costs the
# session. Positive adjustments need no privilege to set and are not reversible
# by the process, which is what makes them stick.

[Service]
Environment="OLLAMA_HOST=127.0.0.1:11435"
Environment="OLLAMA_MAX_LOADED_MODELS=1"
Environment="OLLAMA_KEEP_ALIVE=5m"

OOMScoreAdjust=200

# The readiness gate ollama-proxy.service orders itself against. The packaged
# unit is Type=simple, so systemd calls it active the instant fork() returns --
# seconds before the HTTP listener is up, and every one of those seconds is a
# window where the proxy would forward into a closed port. ExecStartPost is part
# of the start job, so After=ollama.service does not complete until this does.
#
# Written without a single $ on purpose: systemd expands $NAME and ${NAME} on
# ExecStart lines, so a shell loop variable would be substituted away to nothing
# before bash ever saw it. `until` needs no counter. The bound is
# TimeoutStartSec, which counts ExecStartPost too -- if ollama has not answered
# in 60s it is not coming up and the unit should fail loudly rather than hang.
ExecStartPost=/usr/bin/bash -c 'until curl -sf -o /dev/null http://127.0.0.1:11435/; do sleep 0.2; done'
TimeoutStartSec=60
