# bcpc -- earlyoom args.  ->  /etc/systemd/system/earlyoom.service.d/override.conf
# No backslashes on ExecStart (use [.]). Detail: docs/system.md#earlyoom
[Service]
ExecStart=
ExecStart=/usr/bin/earlyoom -r 3600 -m 10,5 -s 100,100 --avoid '^(systemd|Hyprland|sshd|sunshine|pipewire|wireplumber)$' --prefer '^(firefox|claude|claude-desktop)$'
