# bcpc -- earlyoom arguments.
#   ->  /etc/systemd/system/earlyoom.service.d/override.conf
#
# The packaged unit is `ExecStart=/usr/bin/earlyoom $EARLYOOM_ARGS` reading
# EnvironmentFile=-/etc/default/earlyoom. Configuring it there would put our
# settings inside a file pacman owns, so upgrades would drop an earlyoom.pacnew
# beside them and any change to the packaged defaults would need reconciling by
# hand. A drop-in is ours outright -- pacman never writes /etc/systemd/system.
#
# It also avoids a sharp edge on the EnvironmentFile route: systemd splits
# $EARLYOOM_ARGS on whitespace *without* removing quotes, so a quoted regex
# reaches earlyoom with literal quote characters and silently never matches.
# Words on an ExecStart line are quoted normally, so the regexes below can be
# written the obvious way -- with two caveats, both verified by running a unit
# with these exact arguments and dumping what the process received:
#
#   A trailing $ is safe. systemd only expands a $ that begins a valid variable
#   name or a ${...}, so the regex anchors survive untouched. ($$ also yields a
#   literal $, but is not needed here.)
#
#   A backslash is not. systemd processes C-style escapes on this line, and
#   `\.` is not one it knows -- it passes the sequence through but logs
#   "Ignoring unknown escape sequences" on every daemon-reload. The literal dot
#   below is therefore written as the POSIX class [.], which needs no
#   backslash and reloads silently.
#
# Why this layer exists at all when zram is already configured: zram widens the
# margin, it does not remove the failure mode -- a leak larger than the device
# fills it and stalls anyway. And the kernel's own OOM killer is a last resort
# by construction, firing only once reclaim makes literally zero progress,
# which it can postpone for a long time by thrashing executable text pages
# while every process sits in page-fault I/O. earlyoom reads MemAvailable from
# userspace and acts while the machine is still interactive.
#
# -m 10,5     SIGTERM at 10% MemAvailable, SIGKILL at 5% -- earlyoom's own
#             defaults. Idle headroom here sits far above that, so this arms
#             only during a real runaway.
#
# -s 100,100  Ignore swap in the trigger condition, and not cosmetically:
#             earlyoom requires memory AND swap to both be under their minimums
#             before it acts, and our swap is zram, which lives in the very RAM
#             it is protecting. Left at the default it would hold off until the
#             zram device filled too -- by which point the compressed pages have
#             eaten the headroom and we are back in the stall. 100 makes the
#             swap clause always true so the decision rests on MemAvailable.
#
# -r 3600     Memory report interval. The default of 1 writes a journal line
#             every second, forever.
#
# --avoid     Killing the compositor or sshd turns a recoverable incident into
#             a lost session, and sshd is the remote escape hatch.
# --prefer    Proton processes. Steam already sets oom_score_adj on the games it
#             launches, so earlyoom's oom_score ranking would probably reach the
#             same answer unaided; this makes it explicit rather than emergent.
#
# Verify -- earlyoom prints its computed thresholds at startup:
#   systemctl status earlyoom | grep -i 'sending SIGTERM'
[Service]
ExecStart=
ExecStart=/usr/bin/earlyoom -r 3600 -m 10,5 -s 100,100 --avoid '^(systemd|Hyprland|sshd|sunshine|pipewire|wireplumber)$' --prefer '^.*[.]exe$'
