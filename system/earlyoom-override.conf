# bcpc -- earlyoom arguments.
#   ->  /etc/systemd/system/earlyoom.service.d/override.conf
#
# The packaged unit is `ExecStart=/usr/bin/earlyoom $EARLYOOM_ARGS` reading
# EnvironmentFile=-/etc/default/earlyoom. Configuring it there would put our
# settings inside a file pacman owns, so upgrades would drop an earlyoom.pacnew
# beside them and any change to the packaged defaults would need reconciling by
# hand. A drop-in is ours outright -- pacman never writes /etc/systemd/system.
#
# It also avoids a sharp edge on the EnvironmentFile route: systemd splits
# $EARLYOOM_ARGS on whitespace *without* removing quotes, so a quoted regex
# reaches earlyoom with literal quote characters and silently never matches.
# Words on an ExecStart line are quoted normally, so the regexes below can be
# written the obvious way -- with two caveats, both verified by running a unit
# with these exact arguments and dumping what the process received:
#
#   A trailing $ is safe. systemd only expands a $ that begins a valid variable
#   name or a ${...}, so the regex anchors survive untouched. ($$ also yields a
#   literal $, but is not needed here.)
#
#   A backslash is not. systemd processes C-style escapes on this line, and
#   `\.` is not one it knows -- it passes the sequence through but logs
#   "Ignoring unknown escape sequences" on every daemon-reload. The literal dot
#   below is therefore written as the POSIX class [.], which needs no
#   backslash and reloads silently.
#
# Why this layer exists at all when zram is already configured: zram widens the
# margin, it does not remove the failure mode -- a leak larger than the device
# fills it and stalls anyway. And the kernel's own OOM killer is a last resort
# by construction, firing only once reclaim makes literally zero progress,
# which it can postpone for a long time by thrashing executable text pages
# while every process sits in page-fault I/O. earlyoom reads MemAvailable from
# userspace and acts while the machine is still interactive.
#
# -m 10,5     SIGTERM at 10% MemAvailable, SIGKILL at 5% -- earlyoom's own
#             defaults. Idle headroom here sits far above that, so this arms
#             only during a real runaway.
#
# -s 100,100  Ignore swap in the trigger condition, and not cosmetically:
#             earlyoom requires memory AND swap to both be under their minimums
#             before it acts, and our swap is zram, which lives in the very RAM
#             it is protecting. Left at the default it would hold off until the
#             zram device filled too -- by which point the compressed pages have
#             eaten the headroom and we are back in the stall. 100 makes the
#             swap clause always true so the decision rests on MemAvailable.
#
# -r 3600     Memory report interval. The default of 1 writes a journal line
#             every second, forever.
#
# --avoid     Killing the compositor or sshd turns a recoverable incident into
#             a lost session, and sshd is the remote escape hatch.
#
# --prefer    What this box can afford to lose before anything else: the
#             browser and both Claudes -- the Electron desktop app and the CLI
#             are separate processes with separate comm names, so both are
#             listed. The two LLM containers belong in this tier as well but
#             cannot be named here; see below for what carries them instead.
#
#             '^.*[.]exe$' deliberately no longer appears in this regex. It
#             used to, and keeping it would invert the order now wanted:
#             --prefer is a flat +300 with no tiers, so a preferred game beats
#             a preferred browser by whatever margin its RSS earns it, which
#             for a modern title is a wide one. Dropping .exe back to neutral
#             leaves three tiers -- +300 for the disposable apps, 0 for the
#             game, -300 for the session -- which is the intended ordering.
#
#             Both Overwatch installs -- the Steam-store copy and the
#             Battle.net one run as a non-Steam shortcut -- name their binary
#             Overwatch.exe, so comm is the same either way and neither needs
#             a rule of its own.
#
#             The note that used to sit here claimed Steam sets oom_score_adj
#             on the titles it launches, so preferring .exe was only making an
#             emergent ranking explicit. The box does not report that:
#             Overwatch.exe runs at oom_score_adj 0 and reaches the top of the
#             ranking on RSS alone. The adj=300 in that process tree is on
#             steamwebhelper, which is Chromium setting it for its own
#             renderers, not Steam scoring the game.
#
# Why the two LLM containers are not in that regex. --prefer matches
# /proc/pid/comm -- what a process execs or renames itself to, not what you
# typed to start it. Both containers were started and read directly:
#
#   langflow    comm=langflow   (renames itself, setproctitle/PR_SET_NAME)
#   open-webui  comm=python3    (execs /usr/local/bin/python3 -m uvicorn
#                                open_webui.main:app, and never renames)
#
# python3 is unusable as a pattern here, and not merely for being broad: Proton
# starts these titles through
# `python3 .../proton waitforexitandrun ... Overwatch.exe`, which carries the
# identical comm. No regex over comm can separate the container we want killed
# first from the launcher whose game we want killed last -- and --avoid cannot
# rescue it, because prefer and avoid are +300 and -300 on the same process and
# net to zero.
#
# So both containers raise their own oom_score_adj instead, through
# PodmanArgs=--oom-score-adj=450 in containers/open-webui.container and
# containers/langflow.container. earlyoom ranks on /proc/pid/oom_score, which
# already folds oom_score_adj in, so they enter this same comparison by a route
# that depends on no process name at all. langflow could have gone in the
# regex, but both containers carry AutoUpdate=registry on a :latest tag: the
# image that renames its process today is not necessarily the one running next
# month, and a --prefer rule that quietly stops matching is exactly the failure
# the top of this file exists to prevent.
#
# Why 450 rather than the 300 that --prefer adds. oom_score is not exported
# linearly -- /proc/pid/oom_score is (1000 + adj + rss_permille) * 2/3, so the
# entire range from an idle process to one holding all of RAM spans just
# 666..1333. earlyoom's +300 is added to that already-compressed number, while
# oom_score_adj goes in before the 2/3. 450 * 2/3 = 300, so --oom-score-adj=450
# is the exact equivalent of a --prefer match. Confirmed by running the image
# with the flag: comm=langflow, adj=450, oom_score=973.
#
# The ranking this produces, measured with a 19 GiB Overwatch.exe resident --
# the number the whole arrangement has to beat:
#
#   claude-desktop   876 +300 = 1176   (Electron already sets adj 200-300)
#   open-webui         -      =  985   (adj 450, container)
#   firefox          678 +300 =  978
#   langflow           -      =  973   (adj 450, container)
#   claude           670 +300 =  970   (the CLI)
#   Overwatch.exe    931   0  =  931
#   Hyprland         674 -300 =  374
#
# firefox clears the game by 47 points, and on this compressed scale 47 points
# is roughly 2.3 GiB of further game growth -- real headroom, but not vast. If
# a title ever outgrows it, the one-line fix is to move '^.*[.]exe$' into
# --avoid for another 300. That is not the default because it would also rank
# steam and steamwebhelper above the game: earlyoom would churn through a few
# hundred MiB of helpers and then kill the Steam client, which ends the running
# title anyway, without ever reclaiming what the title itself was holding.
#
# Verify -- earlyoom echoes both regexes and its thresholds at startup:
#   systemctl status earlyoom | grep -iE 'prefer|avoid|sending SIGTERM'
#
# To see the ordering these rules actually produce without waiting for a real
# OOM, run a second earlyoom in dry run. -m 99 holds it permanently "below"
# the threshold so it names a victim immediately, and --dryrun means it signals
# nothing; it needs no root, because it never kills:
#   earlyoom --dryrun -r 0 -m 99 -s 100 \
#     --avoid '^(systemd|Hyprland|sshd|sunshine|pipewire|wireplumber)$' \
#     --prefer '^(firefox|claude|claude-desktop)$'
[Service]
ExecStart=
ExecStart=/usr/bin/earlyoom -r 3600 -m 10,5 -s 100,100 --avoid '^(systemd|Hyprland|sshd|sunshine|pipewire|wireplumber)$' --prefer '^(firefox|claude|claude-desktop)$'
