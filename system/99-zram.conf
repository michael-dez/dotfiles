# bcpc -- VM tuning that only makes sense once zram exists.
#                                          ->  /etc/sysctl.d/99-zram.conf
#
# The default swappiness of 60 is calibrated for swap on a spinning disk, where
# paging out is a catastrophe to be deferred. zram is RAM with a compression
# step in front, so paging out is roughly a memcpy -- and is very nearly always
# cheaper than the alternative the kernel picks instead, which is evicting the
# page cache and then the executables' own text pages.
#
# 150 matches what cachyos-settings applies when its zram udev rule fires, so
# this lands on the value this box would have had if it were a stock CachyOS
# install. Values up to 200 are valid on current kernels and 180 is the other
# figure commonly recommended for zram; the difference between 150 and 180 is
# not worth deviating from the distro for.
vm.swappiness = 150

# zram has no seek cost and no readahead to amortise, so faulting in a cluster
# of neighbouring pages just burns decompression on pages nobody asked for.
# 0 = read exactly one page at a time.
vm.page-cluster = 0

# Reclaim a little earlier and more smoothly, so kswapd is not repeatedly woken
# to sprint at the low watermark, which is where reclaim stalls turn total.
# watermark_boost_factor=0 disables the fragmentation-triggered boost, which is
# aimed at huge-page allocation and is noise on this workload.
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
