# bcpc -- Feral GameMode configuration.
#                                          ->  ~/.config/gamemode.ini
#
# Exists for exactly one line: pin_cores=no. Everything else here is either the
# upstream default restated for the record, or a note about why it is absent.
#
# --- the problem this file solves -------------------------------------------
# gamemoded's default is park_cores=no, pin_cores=yes, and per gamemoded(8) the
# pinning autodetect "will currently only properly autodetect Ryzen 7900x3d,
# 7950x3d and Intel CPU:s with E- and P-cores". The 14700KF is the third case,
# so the feature engages and does precisely what it was written to do.
#
# It decides which cores are the good ones by reading
# /sys/devices/system/cpu/cpu*/cpufreq/cpuinfo_max_freq and keeping the fast
# ones. On this host that reads 5.6GHz on cpu8-11, 5.5GHz on the rest of the
# P-cores, and 4.3GHz on cpu16-27 -- so the E-cores are dropped and the whole
# client process tree is pinned to 0-15. Measured, not assumed: under
# `gamemoderun` every one of Overwatch.exe's ~100 threads reported an affinity
# mask of 0-15, against 0-27 for the same game launched without it.
#
# The other discriminator gamemoded knows about, L3 cache size, is uniform here
# --- /sys/devices/system/cpu/cpu*/cache/index3/size reads 33792K on all 28
# CPUs, E-cores included, because they share the one L3. That is why this lands
# as a clean P/E split rather than the CCD split it makes on an X3D part.
#
# Dropping 12 of 28 logical CPUs is a defensible trade for a game whose hot
# threads are few and latency-critical: fewer, faster cores, no cross-domain
# migration. Overwatch under Proton is not that game. It runs ~100 threads and
# the wine, DXVK and shader-compile work sits in the same tree and inherits the
# same mask, so the pinning does not concentrate the render thread -- it deletes
# the overflow capacity that the background work was using and forces it onto
# the same 8 physical cores the renderer needs.
#
# --- what is deliberately NOT here ------------------------------------------
# No [general] renice or ioprio. CachyOS runs ananicy-cpp with
# cachyos-ananicy-rules, which already classifies this tree by name -- it puts
# Overwatch.exe at nice -5 and the idle wine services (services.exe, plugplay,
# explorer, tabtip) at SCHED_IDLE. Setting renice here would fight a daemon that
# has better per-process information than gamemode does. gamemoded's ioprio pass
# is already failing loudly and harmlessly on this host ("Skipping ioprio on
# client: ioprio was (0) but we expected (4)"), which is noise, not a symptom.
#
# No [gpu] section. apply_gpu_optimisations is off by default and stays off;
# it requires accept-responsibility plus explicit clock offsets, and a bad
# offset is a hang, not a slowdown.
#
# --- why gamemode is still worth running ------------------------------------
# It is not a no-op once pinning is off. With gamemoded inactive this host sits
# at scaling_governor=powersave and energy_performance_preference=
# balance_performance; while a client is registered both go to performance.
# That is the part worth keeping, and it is the part that was being paid for
# with 12 cores.

[cpu]
# Restated rather than left implicit: the two settings are independent, and the
# default for this one is already "no". Parking additionally needs membership of
# the gamemode group, which this user has (joined for Sunshine's RLIMIT_NICE).
park_cores=no
# The whole point of the file. See above.
pin_cores=no
