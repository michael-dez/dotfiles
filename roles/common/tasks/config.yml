# Dotfile symlinking tasks
# playbook_dir, not ansible_env.PWD: PWD is wherever you invoked
# ansible-playbook from, so running it outside the repo produced symlinks
# pointing at paths that do not exist.
- name: "Create symlinks for home directory dotfiles"
  become: no
  file:
    src: "{{ playbook_dir }}/{{ item }}"
    dest: "{{ ansible_env.HOME }}/.{{ item }}"
    state: link
    force: yes
  with_items:
    - vimrc
    - tmux.conf
    - zshenv
    - zshrc
    - p10k.zsh

- name: "Create config directories for XDG config files"
  become: no
  file:
    path: "{{ ansible_env.HOME }}/.config/{{ item }}"
    state: directory
    mode: '0755'
  with_items:
    - nvim
    - picom
    - texinfo
    - xfce4/terminal
    - xfce4/xfconf/xfce-perchannel-xml

- name: "Create symlinks for XDG config files"
  become: no
  file:
    src: "{{ playbook_dir }}/{{ item.src }}"
    dest: "{{ ansible_env.HOME }}/.config/{{ item.dest }}"
    state: link
    force: yes
  with_items:
    # Disables gamemoded's default pin_cores=yes, which on this hybrid
    # 14700KF pins the whole client tree to the P-cores (0-15) and costs
    # Overwatch its 12 E-cores. Harmless on non-hybrid hosts: with pinning
    # already a no-op there, the file only restates defaults.
    - { src: "gamemode/gamemode.ini", dest: "gamemode.ini" }
    - { src: "nvim/init.lua", dest: "nvim/init.lua" }
    - { src: "nvim/lua", dest: "nvim/lua" }
    - { src: "picom/picom.conf", dest: "picom/picom.conf" }
    - { src: "picom/picom-animations.conf", dest: "picom/picom-animations.conf" }
    - { src: "texinfo/infokey", dest: "texinfo/infokey" }
    - { src: "xfce4/terminal/terminalrc", dest: "xfce4/terminal/terminalrc" }
    - { src: "xfce4/terminal/accels.scm", dest: "xfce4/terminal/accels.scm" }
    - { src: "xfce4/xfconf/xfce-perchannel-xml/xfce4-terminal.xml", dest: "xfce4/xfconf/xfce-perchannel-xml/xfce4-terminal.xml" }

# Read the login shell out of passwd first so the change below can be skipped
# outright when it already matches. The user module compares shells itself and
# would report ok either way, but it still escalates to run, so the guard is
# what keeps a re-run from needing root at all.
- name: "Read the user's current login shell"
  become: no
  getent:
    database: passwd
    key: "{{ username }}"

# getent_passwd drops the name and leaves the remaining passwd fields in order,
# so index 5 is the shell. Read through ansible_facts rather than the injected
# top-level name, which core 2.24 stops providing.
- name: "Change user shell to zsh"
  become: yes
  user:
    name: "{{ username }}"
    shell: /usr/bin/zsh
  when: ansible_facts['getent_passwd'][username][5] != '/usr/bin/zsh'
