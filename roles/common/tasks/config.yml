# Dotfile symlinks via dotfiles_dir (not PWD or playbook_dir). docs/ansible.md#rolescommon
- name: "Create symlinks for home directory dotfiles"
  become: no
  file:
    src: "{{ dotfiles_dir }}/{{ item }}"
    dest: "{{ ansible_env.HOME }}/.{{ item }}"
    state: link
    force: yes
  with_items:
    - vimrc
    - tmux.conf
    - zshenv
    - zshrc
    - p10k.zsh

- name: "Create config directories for XDG config files"
  become: no
  file:
    path: "{{ ansible_env.HOME }}/.config/{{ item }}"
    state: directory
    mode: '0755'
  with_items:
    - nvim
    - picom
    - texinfo
    - xfce4/terminal
    - xfce4/xfconf/xfce-perchannel-xml

# The when: skips any item whose destination directory already resolves to
# the source's directory -- which happens when an ancestor of dest is itself a
# symlink into this repo. BCLT has exactly that: ~/.config/xfce4 is a directory
# link to the repo's xfce4/, left by the retired install.sh. Through it, dest
# and src are the same path, and force: yes replaced each repo file with a
# symlink to itself, destroying the working-tree copy. Skipping is the correct
# outcome, not a silent failure: the file at dest already IS the repo file.
#
# The directory link is also worth keeping where it exists. xfconf and GTK
# save by writing a temp file and renaming it over the target, which replaces
# a per-file symlink with a regular file and silently detaches it from the
# repo. A rename inside a linked directory lands in the repo, so edits made
# from the xfce4-terminal and Thunar settings dialogs show up in git status.
#
# realpath is a filter, evaluated where the playbook runs; with a local
# connection that is the host being configured.
- name: "Create symlinks for XDG config files"
  become: no
  file:
    src: "{{ dotfiles_dir }}/{{ item.src }}"
    dest: "{{ ansible_env.HOME }}/.config/{{ item.dest }}"
    state: link
    force: yes
  when: >-
    (ansible_facts['env']['HOME'] ~ '/.config/' ~ item.dest) | dirname | realpath
    != (playbook_dir ~ '/' ~ item.src) | dirname | realpath
  with_items:
    - { src: "nvim/init.lua", dest: "nvim/init.lua" }
    - { src: "nvim/lua", dest: "nvim/lua" }
    - { src: "picom/picom.conf", dest: "picom/picom.conf" }
    - { src: "picom/picom-animations.conf", dest: "picom/picom-animations.conf" }
    - { src: "texinfo/infokey", dest: "texinfo/infokey" }
    - { src: "xfce4/terminal/terminalrc", dest: "xfce4/terminal/terminalrc" }
    - { src: "xfce4/terminal/accels.scm", dest: "xfce4/terminal/accels.scm" }
    - { src: "xfce4/xfconf/xfce-perchannel-xml/xfce4-terminal.xml", dest: "xfce4/xfconf/xfce-perchannel-xml/xfce4-terminal.xml" }

- name: "Check for a gamemode.ini link left by older runs"
  become: no
  stat:
    path: "{{ ansible_env.HOME }}/.config/gamemode.ini"
  register: stale_gamemode

- name: "Remove it if it points into this repo (bcpc's link points into iac)"
  become: no
  when: (stale_gamemode.stat.lnk_target | default('')).startswith(dotfiles_dir ~ '/')
  file:
    path: "{{ ansible_env.HOME }}/.config/gamemode.ini"
    state: absent

- name: "Read the user's current login shell"
  become: no
  getent:
    database: passwd
    key: "{{ username }}"

- name: "Change user shell to zsh"
  become: yes
  user:
    name: "{{ username }}"
    shell: /usr/bin/zsh
  when: ansible_facts['getent_passwd'][username][5] != '/usr/bin/zsh'
