# Rootless podman; subuid/subgid delegation. Why: docs/llm.md#rolesllm-ansible
- name: "llm: Install podman"
  become: yes
  package:
    name:
      - podman
    state: present

- name: "llm: Delegate a subordinate id range for rootless containers"
  become: yes
  lineinfile:
    path: "{{ item }}"
    regexp: "^{{ username }}:"
    line: "{{ username }}:100000:65536"
    create: yes
    owner: root
    group: root
    mode: "0644"
  with_items:
    - /etc/subuid
    - /etc/subgid
  register: subids

- name: "llm: Migrate podman storage to the new id range"
  become: no
  when: subids is changed
  command: podman system migrate
  changed_when: true
