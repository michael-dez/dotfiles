# Memory-pressure files are copied, not symlinked (read before /home mounts); the rest are symlinks.
# mkinitcpio -P is required after nvidia modprobe changes. Why: docs/ansible.md#configyml
- name: "bcpc: Create config directories for Wayland desktop"
  become: no
  file:
    path: "{{ ansible_env.HOME }}/.config/{{ item }}"
    state: directory
    mode: '0755'
  with_items:
    - hypr
    - MangoHud
    - kitty
    - sunshine
    - sunshine/hooks
    - pipewire/pipewire.conf.d

- name: "bcpc: Symlink per-host shell config"
  become: no
  file:
    src: "{{ playbook_dir }}/zshrc.bcpc"
    dest: "{{ ansible_env.HOME }}/.zshrc.local"
    state: link
    force: yes

- name: "bcpc: Remove superseded hyprlang and stream-focus symlinks"
  become: no
  file:
    path: "{{ ansible_env.HOME }}/.config/{{ item }}"
    state: absent
  with_items:
    - hypr/hyprland.conf
    - hypr/bcpc.conf
    - hypr/keybinds.conf
    - hypr/decoration.conf
    - sunshine/hooks/stream-focus.py

- name: "bcpc: Symlink Wayland desktop configs"
  become: no
  file:
    src: "{{ playbook_dir }}/{{ item.src }}"
    dest: "{{ ansible_env.HOME }}/.config/{{ item.dest }}"
    state: link
    force: yes
  with_items:
    - { src: "hypr/hyprland.lua", dest: "hypr/hyprland.lua" }
    - { src: "hypr/bcpc.lua", dest: "hypr/bcpc.lua" }
    - { src: "hypr/keybinds.lua", dest: "hypr/keybinds.lua" }
    - { src: "hypr/decoration.lua", dest: "hypr/decoration.lua" }
    - { src: "hypr/animations.lua", dest: "hypr/animations.lua" }
    - { src: "hypr/gaming.lua", dest: "hypr/gaming.lua" }
    - { src: "hypr/stream.lua", dest: "hypr/stream.lua" }
    - { src: "kitty/kitty.conf", dest: "kitty/kitty.conf" }
    - { src: "kitty/colors.conf", dest: "kitty/colors.conf" }
    - { src: "MangoHud/MangoHud.conf", dest: "MangoHud/MangoHud.conf" }
    - { src: "sunshine/sunshine.conf", dest: "sunshine/sunshine.conf" }
    - { src: "sunshine/apps.json", dest: "sunshine/apps.json" }
    - { src: "sunshine/hooks/hyprctl-env.sh", dest: "sunshine/hooks/hyprctl-env.sh" }
    - { src: "sunshine/hooks/stream-start.sh", dest: "sunshine/hooks/stream-start.sh" }
    - { src: "sunshine/hooks/stream-end.sh", dest: "sunshine/hooks/stream-end.sh" }
    - { src: "sunshine/hooks/launch-bigpicture.sh", dest: "sunshine/hooks/launch-bigpicture.sh" }
    - { src: "sunshine/hooks/stream-mode.sh", dest: "sunshine/hooks/stream-mode.sh" }
    - { src: "sunshine/hooks/desktop-audio.sh", dest: "sunshine/hooks/desktop-audio.sh" }
    - { src: "sunshine/hooks/ollama-suspend.sh", dest: "sunshine/hooks/ollama-suspend.sh" }
    - { src: "sunshine/hooks/ollama-resume.sh", dest: "sunshine/hooks/ollama-resume.sh" }
    - { src: "pipewire/sunshine-sink.conf", dest: "pipewire/pipewire.conf.d/sunshine-sink.conf" }

- name: "bcpc: Create state directory for Noctalia"
  become: no
  file:
    path: "{{ ansible_env.HOME }}/.local/state/noctalia"
    state: directory
    mode: '0755'

- name: "bcpc: Symlink Noctalia settings"
  become: no
  file:
    src: "{{ playbook_dir }}/noctalia/settings.toml"
    dest: "{{ ansible_env.HOME }}/.local/state/noctalia/settings.toml"
    state: link
    force: yes

- name: "bcpc: Create Noctalia custom palette directory"
  become: no
  file:
    path: "{{ ansible_env.HOME }}/.config/noctalia/palettes"
    state: directory
    mode: '0755'

- name: "bcpc: Symlink Noctalia custom palettes"
  become: no
  file:
    src: "{{ playbook_dir }}/noctalia/palettes/{{ item }}"
    dest: "{{ ansible_env.HOME }}/.config/noctalia/palettes/{{ item }}"
    state: link
    force: yes
  with_items:
    - Iceberg.json

- name: "bcpc: Add user to the gamemode group so Sunshine can raise thread priority"
  become: yes
  user:
    name: "{{ username }}"
    groups: gamemode
    append: yes

- name: "bcpc: Create the Sunshine systemd drop-in directory"
  become: no
  file:
    path: "{{ ansible_env.HOME }}/.config/systemd/user/app-dev.lizardbyte.app.Sunshine.service.d"
    state: directory
    mode: "0755"

- name: "bcpc: Symlink the Sunshine OOMPolicy drop-in"
  become: no
  file:
    src: "{{ playbook_dir }}/sunshine/systemd/oom.conf"
    dest: "{{ ansible_env.HOME }}/.config/systemd/user/app-dev.lizardbyte.app.Sunshine.service.d/oom.conf"
    state: link
    force: yes
  register: sunshine_dropin

- name: "bcpc: Reload the user systemd manager so the drop-in takes effect"
  become: no
  when: sunshine_dropin is changed
  systemd:
    scope: user
    daemon_reload: yes

- name: "bcpc: Create the earlyoom drop-in directory"
  become: yes
  file:
    path: /etc/systemd/system/earlyoom.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: "bcpc: Install sysrq, zram and earlyoom configuration"
  become: yes
  copy:
    src: "{{ playbook_dir }}/{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
  with_items:
    - { src: "system/99-sysrq.conf",       dest: "/etc/sysctl.d/99-sysrq.conf" }
    - { src: "system/99-zram.conf",        dest: "/etc/sysctl.d/99-zram.conf" }
    - { src: "system/zram-generator.conf", dest: "/etc/systemd/zram-generator.conf" }
    - { src: "system/earlyoom-override.conf", dest: "/etc/systemd/system/earlyoom.service.d/override.conf" }
    - { src: "system/nvidia-bcpc.conf",    dest: "/etc/modprobe.d/nvidia-bcpc.conf" }
  register: mem_conf

- name: "bcpc: Remove the pre-cachyos-settings NVIDIA modprobe config"
  become: yes
  file:
    path: /etc/modprobe.d/nvidia.conf
    state: absent
  register: stale_nvidia_conf

- name: "bcpc: Rebuild the initramfs so early-loaded NVIDIA options apply"
  become: yes
  when: (mem_conf is changed) or (stale_nvidia_conf is changed)
  command: mkinitcpio -P

- name: "bcpc: Note that NVIDIA module options need a reboot"
  when: (mem_conf is changed) or (stale_nvidia_conf is changed)
  debug:
    msg: >-
      Initramfs rebuilt. Reboot, then confirm with:
      grep InitializeSystemMemoryAllocations /proc/driver/nvidia/params
      -- expect 0, not 1.

- name: "bcpc: Load uinput at boot for Sunshine input"
  become: yes
  copy:
    src: "{{ playbook_dir }}/system/uinput.conf"
    dest: /etc/modules-load.d/uinput.conf
    owner: root
    group: root
    mode: "0644"

- name: "bcpc: Apply sysctl settings without rebooting"
  become: yes
  when: mem_conf is changed
  command: sysctl --system

- name: "bcpc: Enable earlyoom"
  become: yes
  systemd:
    name: earlyoom
    daemon_reload: yes
    enabled: yes
    state: restarted

- name: "bcpc: Bring up zram"
  become: yes
  systemd:
    daemon_reload: yes
    name: systemd-zram-setup@zram0.service
    enabled: yes
    state: started
