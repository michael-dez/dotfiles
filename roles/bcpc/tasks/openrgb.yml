# OpenRGB units, detector edits, Iceberg profile. All user-level symlinks. Why: docs/ansible.md#openrgbyml
- name: "bcpc: Create directories for OpenRGB"
  become: no
  file:
    path: "{{ ansible_env.HOME }}/{{ item }}"
    state: directory
    mode: "0755"
  with_items:
    - .local/bin
    - .config/systemd/user
    - .config/OpenRGB

- name: "bcpc: Symlink the OpenRGB units and the gradient daemon"
  become: no
  file:
    src: "{{ playbook_dir }}/{{ item.src }}"
    dest: "{{ ansible_env.HOME }}/{{ item.dest }}"
    state: link
    force: yes
  with_items:
    - { src: "openrgb/iceberg-rgb.py",         dest: ".local/bin/iceberg-rgb" }
    - { src: "openrgb/openrgb-server.service", dest: ".config/systemd/user/openrgb-server.service" }
    - { src: "openrgb/iceberg-rgb.service",    dest: ".config/systemd/user/iceberg-rgb.service" }
  register: openrgb_units

- name: "bcpc: Reload the user systemd manager for the OpenRGB units"
  become: no
  when: openrgb_units is changed
  systemd:
    scope: user
    daemon_reload: yes

- name: "bcpc: Check whether any unwanted OpenRGB detector is still on"
  become: no
  command:
    argv:
      - python3
      - -c
      - |
        import json, sys
        try:
            d = json.load(open(sys.argv[1]))
        except FileNotFoundError:
            d = {}
        on = d.get("Detectors", {}).get("detectors", {})
        print("on" if any(on.get(n, True) for n in json.loads(sys.argv[2])) else "off")
      - "{{ ansible_env.HOME }}/.config/OpenRGB/OpenRGB.json"
      - "{{ openrgb_detectors_off | to_json }}"
  register: openrgb_detectors
  changed_when: false

- name: "bcpc: Stop OpenRGB so it cannot write its settings back over the edit"
  become: no
  when: openrgb_detectors.stdout == "on"
  command: systemctl --user stop iceberg-rgb.service openrgb-server.service

- name: "bcpc: Turn off the unwanted OpenRGB detectors"
  become: no
  when: openrgb_detectors.stdout == "on"
  command:
    argv:
      - python3
      - -c
      - |
        import json, sys
        try:
            d = json.load(open(sys.argv[1]))
        except FileNotFoundError:
            d = {}
        detectors = d.setdefault("Detectors", {}).setdefault("detectors", {})
        for name in json.loads(sys.argv[2]):
            detectors[name] = False
        json.dump(d, open(sys.argv[1], "w"), indent=4)
      - "{{ ansible_env.HOME }}/.config/OpenRGB/OpenRGB.json"
      - "{{ openrgb_detectors_off | to_json }}"

- name: "bcpc: Check for the Iceberg OpenRGB profile"
  become: no
  stat:
    path: "{{ ansible_env.HOME }}/.config/OpenRGB/profiles/Iceberg.json"
  register: openrgb_profile

- name: "bcpc: Start the OpenRGB server to save the profile against"
  become: no
  when: not openrgb_profile.stat.exists
  systemd:
    scope: user
    name: openrgb-server.service
    state: started

- name: "bcpc: Save the Iceberg OpenRGB profile"
  become: no
  when: not openrgb_profile.stat.exists
  command: "{{ ansible_env.HOME }}/.local/bin/iceberg-rgb --save-profile Iceberg"
  args:
    creates: "{{ ansible_env.HOME }}/.config/OpenRGB/profiles/Iceberg.json"

- name: "bcpc: Restart the OpenRGB server after a unit change"
  become: no
  when: openrgb_units is changed
  systemd:
    scope: user
    name: openrgb-server.service
    state: restarted

- name: "bcpc: Start the gradient"
  become: no
  systemd:
    scope: user
    name: iceberg-rgb.service
    state: started
