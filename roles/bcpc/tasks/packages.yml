# cachyos-settings is required (supplies NVreg_InitializeSystemMemoryAllocations=0); ollama-cuda, not ollama.
# Why: docs/ansible.md#packagesyml
- name: "bcpc: Install memory-pressure tooling"
  become: yes
  package:
    name:
      - earlyoom
      - zram-generator
      - cachyos-settings
    state: present

- name: "bcpc: Install ollama with CUDA support"
  become: yes
  package:
    name:
      - ollama-cuda
    state: present

- name: "bcpc: Install OpenRGB"
  become: yes
  package:
    name:
      - openrgb
    state: present
